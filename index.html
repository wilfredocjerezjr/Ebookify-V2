<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Offline HTML Flipbook Exporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #FAF8F5; color: #1E293B; }
        .drop-zone { border: 2px dashed #CBD5E1; transition: all 0.2s; }
        .drop-zone.dragover { background: #F1F5F9; border-color: #94A3B8; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-6">

<div class="w-full max-w-2xl bg-white rounded-xl shadow-xl p-8 border border-slate-200">
    <h1 class="text-2xl font-bold text-center mb-2">PDF to Offline Flipbook</h1>
    <p class="text-center text-slate-500 mb-8">Create a 100% offline, standalone HTML flipbook from any PDF.</p>

    <div class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Book Title</label>
            <input type="text" id="meta-title" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. My Awesome Book">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Author</label>
            <input type="text" id="meta-author" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Jane Doe">
        </div>

        <div id="drop-zone" class="drop-zone rounded-lg p-10 flex flex-col items-center justify-center cursor-pointer bg-slate-50">
            <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mb-3"></i>
            <p class="text-sm text-slate-600 font-medium">Click or drag PDF here</p>
            <p class="text-xs text-slate-400 mt-1">Embeds raw PDF. Max size ~50MB recommended.</p>
            <input type="file" id="file-input" accept="application/pdf" class="hidden">
        </div>

        <div id="file-info" class="hidden flex items-center justify-between p-3 bg-blue-50 border border-blue-100 rounded-lg">
            <div class="flex items-center gap-3">
                <i data-lucide="file-text" class="w-5 h-5 text-blue-500"></i>
                <div>
                    <p id="file-name" class="text-sm font-medium text-blue-900">filename.pdf</p>
                    <p id="file-size" class="text-xs text-blue-600">2.5 MB</p>
                </div>
            </div>
            <button id="btn-remove" class="p-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <button id="btn-export" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled>
            <span id="btn-text">Generate Offline HTML</span>
        </button>

        <div id="progress-container" class="hidden space-y-2">
            <div class="flex justify-between text-xs font-medium text-slate-600">
                <span id="progress-text">Processing...</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>
</div>

<script>
lucide.createIcons();

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileInfo = document.getElementById('file-info');
const fileName = document.getElementById('file-name');
const fileSize = document.getElementById('file-size');
const btnRemove = document.getElementById('btn-remove');
const btnExport = document.getElementById('btn-export');
const btnText = document.getElementById('btn-text');
const titleInput = document.getElementById('meta-title');
const authorInput = document.getElementById('meta-author');
const progressContainer = document.getElementById('progress-container');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const progressPct = document.getElementById('progress-pct');

let currentFile = null;
let currentBase64 = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
});

btnRemove.addEventListener('click', () => {
    currentFile = null;
    currentBase64 = null;
    fileInfo.classList.add('hidden');
    dropZone.classList.remove('hidden');
    btnExport.disabled = true;
    fileInput.value = '';
});

function handleFile(file) {
    if (file.type !== 'application/pdf') {
        alert('Please select a valid PDF file.');
        return;
    }
    currentFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
    
    if (!titleInput.value) {
        titleInput.value = file.name.replace('.pdf', '');
    }

    dropZone.classList.add('hidden');
    fileInfo.classList.remove('hidden');
    
    const reader = new FileReader();
    reader.onload = (e) => {
        const b64 = e.target.result;
        currentBase64 = b64.substring(b64.indexOf(',') + 1);
        btnExport.disabled = false;
    };
    reader.readAsDataURL(file);
}

function updateProgress(pct, text) {
    progressContainer.classList.remove('hidden');
    progressBar.style.width = `${pct}%`;
    progressPct.textContent = `${pct}%`;
    progressText.textContent = text;
}

btnExport.addEventListener('click', async () => {
    btnExport.disabled = true;
    btnText.textContent = 'Generating...';
    
    try {
        updateProgress(10, 'Fetching PDF.js Engine...');
        const pdfJsRes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js');
        const pdfJsCode = await pdfJsRes.text();
        
        updateProgress(40, 'Fetching PDF.js Worker...');
        const pdfWorkerRes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js');
        const pdfWorkerCode = await pdfWorkerRes.text();
        
        updateProgress(70, 'Fetching StPageFlip Engine...');
        const pageFlipRes = await fetch('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js');
        const pageFlipCode = await pageFlipRes.text();
        
        updateProgress(85, 'Building HTML Package...');
        
        const exportedHtml = generateOfflineHtml(
            titleInput.value || 'Flipbook',
            authorInput.value || 'Unknown Author',
            currentBase64,
            pdfJsCode,
            pdfWorkerCode,
            pageFlipCode
        );

        updateProgress(95, 'Preparing Download...');
        
        const blob = new Blob([exportedHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${titleInput.value || 'book'}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        updateProgress(100, 'Done!');
        setTimeout(() => {
            progressContainer.classList.add('hidden');
            btnExport.disabled = false;
            btnText.textContent = 'Generate Offline HTML';
        }, 2000);

    } catch (err) {
        console.error(err);
        alert('An error occurred during export. Check console for details.');
        btnExport.disabled = false;
        btnText.textContent = 'Generate Offline HTML';
        progressContainer.classList.add('hidden');
    }
});

function generateOfflineHtml(title, author, pdfBase64, pdfJsCode, pdfWorkerCode, pageFlipCode) {
    const safeTitle = title.replace(/"/g, '&quot;');
    const safeAuthor = author.replace(/"/g, '&quot;');
    
    const scriptOpen = "<scr" + "ipt>";
    const scriptClose = "</scr" + "ipt>";
    
    const safePdfJs = pdfJsCode.replace(/<\/script>/gi, '<\\/script>');
    const safePdfWorker = pdfWorkerCode.replace(/<\/script>/gi, '<\\/script>');
    const safePageFlip = pageFlipCode.replace(/<\/script>/gi, '<\\/script>');
    
    return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>${safeTitle} - Offline Flipbook</title>
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --bg-color: #FAF8F5;
            --text-color: #1E293B;
            --toolbar-bg: rgba(255, 255, 255, 0.94);
            --toolbar-border: rgba(226, 232, 240, 0.8);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; position: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        
        /* Toolbar */
        header {
            position: fixed; top: 0; left: 0; right: 0;
            height: calc(52px + var(--sat));
            padding-top: var(--sat);
            padding-left: calc(12px + var(--sal));
            padding-right: calc(12px + var(--sar));
            z-index: 50; display: flex; align-items: center; justify-content: space-between;
            background-color: var(--toolbar-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--toolbar-border);
        }
        .header-title { display: flex; flex-direction: column; max-width: 200px; }
        .header-title h1 { margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-title p { margin: 0; font-size: 10px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .toolbar-group { display: flex; align-items: center; gap: 4px; }
        .btn { 
            background: transparent; border: none; padding: 6px; border-radius: 6px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #475569; transition: background 0.2s;
        }
        .btn:hover { background: rgba(0,0,0,0.05); color: #0F172A; }
        .btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        
        .page-input-group {
            display: flex; align-items: center; background: rgba(0,0,0,0.04);
            border-radius: 6px; padding: 2px 6px; border: 1px solid rgba(0,0,0,0.05);
        }
        .page-input-group input {
            width: 36px; text-align: center; background: transparent; border: none;
            font-size: 12px; font-weight: bold; color: var(--text-color); outline: none;
        }
        .page-input-group span { font-size: 12px; color: #64748B; margin-left: 2px; }

        /* Viewport & Zoom Stage */
        #book-viewport {
            position: absolute;
            top: calc(52px + var(--sat));
            bottom: var(--sab); left: var(--sal); right: var(--sar);
            width: auto; height: auto;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 4px;
        }
        #zoom-stage {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease-out; transform-origin: center center;
            will-change: transform;
        }
        #flipbook-container {
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.25); border-radius: 4px;
        }
        
        /* Pages */
        .page-wrapper {
            background: #fff; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .page-wrapper canvas {
            width: 100%; height: 100%;
            object-fit: contain; pointer-events: none;
        }
        .page-loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #94A3B8; font-size: 12px; font-weight: 500; background: #fff;
        }
        .stf__block {
            background-color: transparent !important;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #3B82F6; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="font-size: 14px; font-weight: 600; color: #475569;" id="loading-text">Loading Engine...</div>
    </div>

    <header>
        <div class="toolbar-group">
            <div class="header-title">
                <h1>${safeTitle}</h1>
                <p>${safeAuthor}</p>
            </div>
        </div>
        <div class="toolbar-group">
            <button class="btn" id="btn-prev" title="Previous Page">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="page-input-group">
                <input type="number" id="page-input" value="1" min="1">
                <span id="page-total">/ -</span>
            </div>
            <button class="btn" id="btn-next" title="Next Page">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
        <div class="toolbar-group">
            <button class="btn" id="btn-fullscreen" title="Fullscreen">
                <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
        </div>
    </header>

    <div id="book-viewport">
        <div id="zoom-stage">
            <div id="flipbook-container"></div>
        </div>
    </div>

    <!-- 100% OFFLINE BUNDLED SCRIPTS -->
    ${scriptOpen}
        ${safePdfJs}
    ${scriptClose}
    ${scriptOpen}
        ${safePageFlip}
    ${scriptClose}
    <script type="text/plain" id="pdf-worker-code">
${safePdfWorker}
    ${scriptClose}

    <!-- MAIN APP LOGIC -->
    ${scriptOpen}
        const PDF_B64 = "${pdfBase64}";
        
        let pdfDoc = null;
        let pageFlip = null;
        let totalPages = 0;
        let pdfPages = [];
        
        let zoomLevel = 1.0;
        let panX = 0; let panY = 0;
        let isPanning = false; let touchStartDist = 0; let touchStartZoom = 1;
        let touchStartPan = {x:0, y:0}; let touchStartPos = {x:0, y:0};
        let lastTapTime = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('loading-text').innerText = 'Parsing PDF Data...';
            try {
                const workerEl = document.getElementById('pdf-worker-code');
                if (workerEl) {
                    const workerBlob = new Blob([workerEl.textContent], { type: 'text/javascript' });
                    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(workerBlob);
                }
            } catch(e) {}

            try {
                const binaryString = atob(PDF_B64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                const loadingTask = pdfjsLib.getDocument({data: bytes});
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                
                document.getElementById('page-total').innerText = '/ ' + totalPages;
                document.getElementById('page-input').max = totalPages;
                
                document.getElementById('loading-text').innerText = 'Initializing Book...';
                await initBook();
                
                document.getElementById('loading-screen').style.display = 'none';
                
                const saved = localStorage.getItem('flipbook_${safeTitle.replace(/\s+/g,'_')}');
                if (saved) {
                    const p = parseInt(saved, 10);
                    if (p >= 0 && p < totalPages) {
                        pageFlip.flip(p);
                    }
                }
                
                setupEvents();

            } catch (err) {
                console.error(err);
                document.getElementById('loading-text').innerText = 'Error loading PDF';
            }
        });

        async function initBook() {
            const vp = document.getElementById('book-viewport');
            const container = document.getElementById('flipbook-container');
            container.innerHTML = '';
            pdfPages = new Array(totalPages).fill(null);
            
            const p1 = await pdfDoc.getPage(1);
            const p1Vp = p1.getViewport({scale: 1.0});
            const aspect = p1Vp.width / p1Vp.height;
            
            const availW = Math.max(280, vp.clientWidth - 8);
            const availH = Math.max(320, vp.clientHeight - 8);
            
            const isPortrait = availW < 768 || availW < availH;
            
            let pageWidth, pageHeight;
            
            if (isPortrait) {
                pageWidth = Math.floor(Math.min(availW, availH * aspect));
                pageHeight = Math.floor(pageWidth / aspect);
            } else {
                pageWidth = Math.floor(Math.min(availW / 2, availH * aspect));
                pageHeight = Math.floor(pageWidth / aspect);
            }
            
            for (let i = 0; i < totalPages; i++) {
                const d = document.createElement('div');
                d.className = 'page-wrapper';
                d.id = 'page-' + i;
                d.innerHTML = '<div class="page-loading">Page ' + (i+1) + '</div>';
                container.appendChild(d);
            }
            
            if (pageFlip) pageFlip.destroy();
            
            pageFlip = new St.PageFlip(container, {
                width: pageWidth,
                height: pageHeight,
                size: 'stretch',
                minWidth: 150,
                maxWidth: 2500,
                minHeight: 200,
                maxHeight: 3000,
                maxShadowOpacity: 0.4,
                showCover: true,
                mobileScrollSupport: false,
                usePortrait: isPortrait,
                clickToFlip: true
            });
            
            pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));
            
            pageFlip.on('flip', (e) => {
                const p = e.data;
                document.getElementById('page-input').value = p + 1;
                localStorage.setItem('flipbook_${safeTitle.replace(/\s+/g,'_')}', p);
                lazyRender(p);
            });
            
            lazyRender(0);
        }

        async function renderPage(pageNum) {
            if (pageNum < 0 || pageNum >= totalPages) return;
            if (pdfPages[pageNum]) return;
            pdfPages[pageNum] = 'loading';
            
            try {
                const p = await pdfDoc.getPage(pageNum + 1);
                const dpr = window.devicePixelRatio || 1;
                
                const el = document.getElementById('page-' + pageNum);
                const rect = el.getBoundingClientRect();
                
                const scale = (rect.height / p.getViewport({scale: 1}).height) * dpr;
                const viewport = p.getViewport({scale: scale});
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', {alpha: false});
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                
                await p.render({ canvasContext: ctx, viewport: viewport }).promise;
                
                el.innerHTML = '';
                el.appendChild(canvas);
                pdfPages[pageNum] = true;
            } catch(err) {
                console.error(err);
                pdfPages[pageNum] = null;
            }
        }

        function lazyRender(currentIdx) {
            const toRender = [currentIdx];
            if (currentIdx > 0) toRender.push(currentIdx - 1);
            if (currentIdx > 1) toRender.push(currentIdx - 2);
            if (currentIdx < totalPages - 1) toRender.push(currentIdx + 1);
            if (currentIdx < totalPages - 2) toRender.push(currentIdx + 2);
            if (currentIdx < totalPages - 3) toRender.push(currentIdx + 3);
            
            toRender.forEach(p => {
                if (!pdfPages[p]) renderPage(p);
            });
        }

        function setupEvents() {
            document.getElementById('btn-prev').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
            document.getElementById('btn-next').addEventListener('click', () => pageFlip && pageFlip.flipNext());
            
            document.getElementById('page-input').addEventListener('change', (e) => {
                let v = parseInt(e.target.value, 10);
                if (v > 0 && v <= totalPages) pageFlip.flip(v - 1);
            });
            
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                else document.exitFullscreen();
            });
            
            const vp = document.getElementById('book-viewport');
            const stage = document.getElementById('zoom-stage');
            
            function updateTransform() {
                if (zoomLevel <= 1.01) {
                    zoomLevel = 1.0; panX = 0; panY = 0;
                    stage.style.transform = 'none';
                    stage.style.cursor = 'default';
                } else {
                    const maxPx = (vp.clientWidth * (zoomLevel - 1)) / 1.5;
                    const maxPy = (vp.clientHeight * (zoomLevel - 1)) / 1.5;
                    panX = Math.max(-maxPx, Math.min(maxPx, panX));
                    panY = Math.max(-maxPy, Math.min(maxPy, panY));
                    stage.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoomLevel + ')';
                    stage.style.cursor = 'grab';
                }
            }
            
            function getTouchDist(t1, t2) {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx*dx + dy*dy);
            }
            
            vp.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    touchStartDist = getTouchDist(e.touches[0], e.touches[1]);
                    touchStartZoom = zoomLevel;
                    isPanning = false;
                } else if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - lastTapTime < 300) {
                        zoomLevel = zoomLevel > 1.05 ? 1.0 : 2.0;
                        updateTransform();
                        lastTapTime = 0; return;
                    }
                    lastTapTime = now;
                    if (zoomLevel > 1.01) {
                        isPanning = true;
                        touchStartPos = {x: e.touches[0].clientX, y: e.touches[0].clientY};
                        touchStartPan = {x: panX, y: panY};
                    }
                }
            }, {passive: false});
            
            vp.addEventListener('touchmove', e => {
                if (e.touches.length === 2 && touchStartDist > 0) {
                    e.preventDefault();
                    const dist = getTouchDist(e.touches[0], e.touches[1]);
                    zoomLevel = Math.max(1.0, Math.min(3.5, touchStartZoom * (dist / touchStartDist)));
                    updateTransform();
                } else if (e.touches.length === 1 && isPanning && zoomLevel > 1.01) {
                    e.preventDefault();
                    panX = touchStartPan.x + (e.touches[0].clientX - touchStartPos.x);
                    panY = touchStartPan.y + (e.touches[0].clientY - touchStartPos.y);
                    updateTransform();
                }
            }, {passive: false});
            
            vp.addEventListener('touchend', e => {
                if (e.touches.length < 2) touchStartDist = 0;
                if (e.touches.length === 0) isPanning = false;
            });
            
            vp.addEventListener('wheel', e => {
                if (e.ctrlKey || zoomLevel > 1.01) {
                    e.preventDefault();
                    zoomLevel = Math.max(1.0, Math.min(3.5, zoomLevel + (e.deltaY < 0 ? 0.2 : -0.2)));
                    updateTransform();
                }
            }, {passive: false});

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { 
                    const cp = pageFlip.getCurrentPageIndex();
                    initBook().then(() => {
                        if (cp > 0) pageFlip.flip(cp);
                    });
                }, 200);
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(() => { 
                    const cp = pageFlip.getCurrentPageIndex();
                    initBook().then(() => {
                        if (cp > 0) pageFlip.flip(cp);
                    });
                }, 200);
            });
        }
    ${scriptClose}
</body>
</html>`;
}
</script>
